# Relais CRM de Club Catalist — voir la section « Relais CRM » du README.
# La clé Brevo n'est PAS ici : elle se dépose comme secret
#   npx wrangler secret put BREVO_API_KEY
name = "clubcatalist-relay"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
# Origines autorisées à appeler le relais (séparées par des virgules)
ALLOWED_ORIGINS = "https://clubcatalist.cmon-sports.com"
# Liste Brevo « CMON_SOLUTION_CLUBCATALIST »
BREVO_LIST_ID = "63"
# Alerte « appel chaud » : destinataire(s) et expéditeur vérifié chez Brevo
NOTIFY_TO = "douglas@cmon-sports.com"
NOTIFY_SENDER = "noreply@cmon-sports.com"

# 30 requêtes par minute et par adresse IP : largement assez pour un
# joueur, trop peu pour remplir le CRM d'adresses inventées.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
